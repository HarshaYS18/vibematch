name: vibematch_app
description: "FunKey production Flutter client."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  crypto: ^3.0.7
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.5
  uuid: ^4.5.3
  video_player: ^2.10.1
  youtube_player_iframe: ^6.0.2
  flutter_inappwebview: ^6.1.5
  web_socket_channel: ^3.0.3
  file_picker: ^10.3.3
  image_picker: ^1.2.1
  image: ^4.5.4
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  socket_io_client: ^3.1.4
  flutter_webrtc: 1.5.2
  mediasfu_mediasoup_client: 0.1.4
  google_sign_in: ^6.2.2
  on_audio_query: ^2.9.0
  permission_handler: ^12.0.1
  cross_file: ^0.3.4+2
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  flutter_local_notifications: ^21.0.0
  sentry_flutter: ^9.30.0

dependency_overrides:
  sdp_transform:
    path: third_party/sdp_transform

dev_dependencies:
  flutter_test:
    sdk: flutter
  sdp_transform: any

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/branding/
    - assets/images/vip_tags/
    - assets/images/svip_tags/
    - assets/gifts/lucky/
    - assets/gifts/broadcast/
    - assets/gifts/love_rocket/icon/
    - assets/videos/gifts/
    - assets/images/room_backgrounds/cricket/default/
    - assets/images/family_badges/
    - assets/images/mini_profile_decorations/
