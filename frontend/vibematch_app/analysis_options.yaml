# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides). The analyzer can also be invoked from the
# command line by running `flutter analyze`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Local/manual backup folders should never be analyzed as app source.
    - backup_live_room_overlay/**
    - '**/backup_live_room_overlay/**'
    - '**/*_backup.dart'
    - '**/*_local_backup.dart'
    # Vendored packages keep their upstream style/lints and are validated by
    # their own focused regression tests rather than FunKey app lints.
    - third_party/**
    - '**/third_party/**'

  errors:
    # Current Profile/Vibes files contain old UI prototype patterns that do not
    # block runtime behavior. Keep analyze clean while live-room UI is refined;
    # refactor these files properly when Profile/Vibes polish resumes.
    unused_field: ignore
    unused_element_parameter: ignore
    unnecessary_nullable_for_final_variable_declarations: ignore
    library_private_types_in_public_api: ignore
    prefer_final_fields: ignore

    # Legacy real-time media files intentionally keep stable code paths during
    # mobile testing. These are non-blocking analyzer info lints and will be
    # refactored during the dedicated WebRTC/media cleanup pass.
    unnecessary_import: ignore
    unused_import: ignore
    use_build_context_synchronously: ignore
    prefer_null_aware_operators: ignore

    # Style-only lint. Keep analyze focused on real compile/runtime issues while
    # large live-room/control-center files are being modularized gradually.
    curly_braces_in_flow_control_structures: ignore
    unnecessary_underscores: ignore

linter:
  rules:
    # avoid_print: false
    # prefer_single_quotes: true