apiVersion: v1
kind: Service
metadata: {name: funkey-opensearch}
spec:
  selector: {app: funkey-opensearch}
  ports:
    - {name: http, port: 9200, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: funkey-opensearch}
spec:
  serviceName: funkey-opensearch
  replicas: 1
  selector: {matchLabels: {app: funkey-opensearch}}
  template:
    metadata: {labels: {app: funkey-opensearch}}
    spec:
      nodeSelector: {funkey.io/workload: data}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          ports: [{name: http, containerPort: 9200}]
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts: [{name: data, mountPath: /usr/share/opensearch/data}]
          readinessProbe:
            httpGet: {path: /_cluster/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
