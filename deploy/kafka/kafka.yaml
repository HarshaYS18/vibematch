---
apiVersion: batch/v1
kind: Job
metadata: {name: funkey-kafka-topics}
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {app: funkey-kafka-topic-provisioner}}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provision
          image: funkey-kafka-event-bridge:dev
          command: ["python", "provision_topics.py"]
          env:
            - {name: KAFKA_BOOTSTRAP_SERVERS, value: "funkey-kafka-bootstrap:9092"}
            - {name: KAFKA_SECURITY_PROTOCOL, value: PLAINTEXT}
            - {name: KAFKA_TOPIC_REPLICATION_FACTOR, value: "3"}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: funkey-kafka}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: funkey-kafka}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: funkey-kafka-ingress}
spec:
  podSelector: {matchLabels: {app: funkey-kafka}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: funkey-kafka}}
        - podSelector: {matchLabels: {app: funkey-kafka-event-bridge}}
        - podSelector: {matchLabels: {app: funkey-kafka-topic-provisioner}}
      ports:
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 9093}
