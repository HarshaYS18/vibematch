apiVersion: v1
kind: Service
metadata: {name: funkey-kafka-bootstrap, labels: {app: funkey-kafka}}
spec:
  selector: {app: funkey-kafka}
  ports:
    - {name: broker, port: 9092, targetPort: broker}
---
apiVersion: v1
kind: Service
metadata: {name: funkey-kafka-1}
spec:
  selector: {app: funkey-kafka, funkey.io/kafka-node: "1"}
  ports:
    - {name: broker, port: 9092, targetPort: broker}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata: {name: funkey-kafka-2}
spec:
  selector: {app: funkey-kafka, funkey.io/kafka-node: "2"}
  ports:
    - {name: broker, port: 9092, targetPort: broker}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: v1
kind: Service
metadata: {name: funkey-kafka-3}
spec:
  selector: {app: funkey-kafka, funkey.io/kafka-node: "3"}
  ports:
    - {name: broker, port: 9092, targetPort: broker}
    - {name: controller, port: 9093, targetPort: controller}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: funkey-kafka-1}
spec:
  serviceName: funkey-kafka-1
  replicas: 1
  selector: {matchLabels: {app: funkey-kafka, funkey.io/kafka-node: "1"}}
  template:
    metadata: {labels: {app: funkey-kafka, funkey.io/kafka-node: "1"}}
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector: {funkey.io/workload: data}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports: [{name: broker, containerPort: 9092}, {name: controller, containerPort: 9093}]
          env:
            - {name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk"}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: broker,controller}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://funkey-kafka-1:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@funkey-kafka-1:9093,2@funkey-kafka-2:9093,3@funkey-kafka-3:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "2"}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: "3"}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: "2"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
          resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
          volumeMounts: [{name: data, mountPath: /var/lib/kafka/data}]
          readinessProbe:
            tcpSocket: {port: broker}
            initialDelaySeconds: 20
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 50Gi}}
---
