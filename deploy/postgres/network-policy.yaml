apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-pgbouncer-ingress
spec:
  podSelector:
    matchLabels: {app: funkey-pgbouncer}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [funkey-api, funkey-worker]
      ports: [{protocol: TCP, port: 6432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-postgres-exporter-ingress
spec:
  podSelector:
    matchLabels: {app: funkey-postgres-exporter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{protocol: TCP, port: 9187}]
