apiVersion: v1
kind: ConfigMap
metadata:
  name: funkey-otel-backends
data:
  # Integration contracts only. Patch to the real managed/self-hosted endpoints.
  TEMPO_OTLP_HTTP_ENDPOINT: http://tempo.monitoring.svc.cluster.local:4318
  LOKI_OTLP_HTTP_ENDPOINT: http://loki.monitoring.svc.cluster.local:3100/otlp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: funkey-otel-collector-config
data:
  collector.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 384
        spike_limit_mib: 96
      batch:
        timeout: 5s
        send_batch_size: 1024
        send_batch_max_size: 2048
      resource:
        attributes:
          - key: platform
            value: funkey
            action: upsert

    exporters:
      otlphttp/tempo:
        endpoint: ${env:TEMPO_OTLP_HTTP_ENDPOINT}
        timeout: 5s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 15s
          max_elapsed_time: 60s
        sending_queue:
          enabled: true
          queue_size: 2048
          num_consumers: 4
      otlphttp/loki:
        endpoint: ${env:LOKI_OTLP_HTTP_ENDPOINT}
        timeout: 5s
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 15s
          max_elapsed_time: 60s
        sending_queue:
          enabled: true
          queue_size: 2048
          num_consumers: 4

    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/loki]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-otel-collector
  labels: {app: funkey-otel-collector}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: funkey-otel-collector}}
  template:
    metadata:
      labels: {app: funkey-otel-collector}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8888"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: ["--config=/etc/otelcol/collector.yaml"]
          envFrom:
            - configMapRef: {name: funkey-otel-backends}
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: health, containerPort: 13133}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe:
            httpGet: {path: /, port: health}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: config
          configMap: {name: funkey-otel-collector-config}
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-otel-collector
spec:
  selector: {app: funkey-otel-collector}
  ports:
    - {name: otlp-grpc, port: 4317, targetPort: otlp-grpc}
    - {name: otlp-http, port: 4318, targetPort: otlp-http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: funkey-otel-collector
spec:
  minAvailable: 1
  selector: {matchLabels: {app: funkey-otel-collector}}
