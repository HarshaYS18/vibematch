apiVersion: v1
kind: ServiceAccount
metadata: {name: funkey-media}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-media
  labels: {app: funkey-media}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: funkey-media}}
  template:
    metadata:
      labels: {app: funkey-media}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "4100"
    spec:
      # mediasoup uses a node-local UDP range. One pod per routable media node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: funkey-media
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 420
      nodeSelector: {funkey.io/workload: media}
      tolerations:
        - {key: funkey.io/media, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: {matchLabels: {app: funkey-media}}
              topologyKey: kubernetes.io/hostname
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: media
          image: funkey-media:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: signaling, containerPort: 4100, hostPort: 4100, protocol: TCP}]
          env:
            - name: NODE_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: MEDIA_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: MEDIA_SERVICE_PORT, value: "4100"}
            - {name: MEDIA_PUBLIC_URL, value: "http://$(NODE_IP):4100"}
            - {name: MEDIASOUP_LISTEN_IP, value: "0.0.0.0"}
            - {name: MEDIASOUP_ANNOUNCED_IP, value: "$(NODE_IP)"}
            - {name: MEDIASOUP_MIN_PORT, value: "40000"}
            - {name: MEDIASOUP_MAX_PORT, value: "49999"}
            - {name: FASTAPI_BASE_URL, value: "http://funkey-api:8000"}
            - name: MEDIA_INTERNAL_TOKEN
              valueFrom: {secretKeyRef: {name: funkey-api-secrets, key: MEDIA_INTERNAL_TOKEN}}
            - {name: CORS_ORIGIN, value: "https://app.example.invalid"}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "8", memory: 8Gi}
          startupProbe:
            httpGet: {path: /health, port: signaling}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health, port: signaling}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: signaling}
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - node
                  - -e
                  - >-
                    const base='http://127.0.0.1:4100';
                    (async()=>{
                      const response=await fetch(base+'/drain',{method:'POST'});
                      if(!response.ok)throw Error('media drain registration failed: '+response.status);
                      const deadline=Date.now()+300000;
                      while(Date.now()<deadline){
                        const health=await fetch(base+'/health').then(r=>r.json());
                        if(health.peerCount===0)return;
                        await new Promise(resolve=>setTimeout(resolve,5000));
                      }
                      console.error('media drain deadline reached with peers still connected');
                    })().catch(error=>{console.error(error);process.exitCode=1});
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: funkey-media}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: funkey-media}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: funkey-media}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: funkey-media}
  minReplicas: 3
  maxReplicas: 30
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 1800
      policies: [{type: Pods, value: 1, periodSeconds: 300}]
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 55}
    - type: Pods
      pods:
        metric: {name: funkey_media_peers}
        target: {type: AverageValue, averageValue: "1000"}
    - type: Pods
      pods:
        metric: {name: funkey_media_rooms}
        target: {type: AverageValue, averageValue: "125"}
