apiVersion: v1
kind: ServiceAccount
metadata: {name: funkey-recommendation}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-recommendation
  labels: {app: funkey-recommendation}
spec:
  selector: {app: funkey-recommendation}
  ports:
    - {name: http, port: 8094, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-recommendation
  labels: {app: funkey-recommendation}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector: {matchLabels: {app: funkey-recommendation}}
  template:
    metadata:
      labels: {app: funkey-recommendation}
    spec:
      serviceAccountName: funkey-recommendation
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector: {funkey.io/workload: application}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: recommendation
          image: funkey-recommendation:dev
          ports: [{name: http, containerPort: 8094}]
          envFrom:
            - {configMapRef: {name: funkey-config}}
          env:
            - name: KAFKA_USERNAME
              valueFrom: {secretKeyRef: {name: funkey-kafka-secrets, key: kafka_username, optional: true}}
            - name: KAFKA_PASSWORD
              valueFrom: {secretKeyRef: {name: funkey-kafka-secrets, key: kafka_password, optional: true}}
          resources:
            requests: {cpu: 150m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          startupProbe: {httpGet: {path: /live, port: http}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: http}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: funkey-recommendation}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: funkey-recommendation}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: funkey-recommendation}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: funkey-recommendation}
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
