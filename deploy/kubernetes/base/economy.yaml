apiVersion: v1
kind: ServiceAccount
metadata:
  name: funkey-economy
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-economy
  labels:
    app: funkey-economy
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: funkey-economy
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8088"
      labels:
        app: funkey-economy
    spec:
      serviceAccountName: funkey-economy
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        funkey.io/workload: application
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: funkey-economy
      containers:
        - name: economy
          image: funkey-economy:dev
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: funkey-config
            - secretRef:
                name: funkey-economy-secrets
          resources:
            requests:
              cpu: 350m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
          startupProbe:
            httpGet: {path: /live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-economy
spec:
  selector:
    app: funkey-economy
  ports:
    - name: http
      port: 8088
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: funkey-economy
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: funkey-economy
