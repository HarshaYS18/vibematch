apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-api-ingress
spec:
  podSelector: {matchLabels: {app: funkey-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{protocol: TCP, port: 8000}]
---
