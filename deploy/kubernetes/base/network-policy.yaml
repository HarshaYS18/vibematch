apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Public dynamic backends: same-namespace callers, Envoy data plane, and
# explicitly labeled observability namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-api-ingress
spec:
  podSelector: {matchLabels: {app: funkey-api}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              funkey.io/observability-access: "true"
      ports: [{protocol: TCP, port: 8000}]
---
