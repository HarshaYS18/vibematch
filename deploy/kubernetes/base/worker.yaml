apiVersion: v1
kind: ServiceAccount
metadata:
  name: funkey-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-worker
  labels: {app: funkey-worker}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: funkey-worker}}
  template:
    metadata:
      labels: {app: funkey-worker}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: funkey-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      nodeSelector: {funkey.io/workload: application}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: funkey-worker}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: funkey-worker:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: health, containerPort: 8082}]
          envFrom:
            - configMapRef: {name: funkey-config}
            - secretRef: {name: funkey-api-secrets}
          env:
            - {name: DB_POOL_SIZE, value: "3"}
            - {name: DB_MAX_OVERFLOW, value: "0"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /live, port: health}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: health}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: funkey-worker
spec:
  minAvailable: 1
  selector: {matchLabels: {app: funkey-worker}}
