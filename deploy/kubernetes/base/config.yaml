apiVersion: v1
kind: ConfigMap
metadata:
  name: funkey-config
data:
  APP_ENV: staging
  ENFORCE_SCHEMA_CURRENT: "true"
  ENABLE_DEV_LOGIN: "false"
  CORS_ALLOWED_ORIGINS: https://app.example.invalid
  MEDIA_STORAGE_DRIVER: s3
  MEDIA_CDN_BASE_URL: https://cdn.example.invalid/media
  REALTIME_LISTEN_ADDR: :8081
  REALTIME_AUTH_VERIFY_URL: http://funkey-api:8000/api/v1/realtime/verify
  REALTIME_REDIS_URL: redis://redis.example.invalid:6379/0
  REALTIME_ORIGINS: https://app.example.invalid
  REALTIME_DRAIN_TIMEOUT: 120s
  NATS_URL: nats://nats.example.invalid:4222
