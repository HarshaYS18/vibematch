apiVersion: v1
kind: ConfigMap
metadata:
  name: funkey-config
data:
  APP_ENV: staging
  ENFORCE_SCHEMA_CURRENT: "true"
  ENABLE_DEV_LOGIN: "false"
  RATE_LIMIT_ENABLED: "true"
  OTEL_TRACES_ENABLED: "true"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://funkey-otel-collector.monitoring.svc.cluster.local:4318/v1/traces
  OTEL_TRACE_SAMPLE_RATIO: "0.10"
  OTEL_EXPORT_TIMEOUT_SECONDS: "3"

  DB_POOLER_MODE: transaction
  DB_APPLICATION_NAME: funkey-api
  DB_LOCK_TIMEOUT_MS: "1000"
  DB_STATEMENT_TIMEOUT_MS: "3000"
  DB_IDLE_IN_TRANSACTION_SESSION_TIMEOUT_MS: "10000"
  DB_SLOW_QUERY_MS: "500"
  DB_CONNECT_TIMEOUT_SECONDS: "5"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "0"
  DB_POOL_TIMEOUT_SECONDS: "3"
  DB_POOL_RECYCLE_SECONDS: "1800"
  DB_POOL_USE_LIFO: "true"
  API_MAX_REPLICAS: "30"
  DB_API_CONNECTION_BUDGET: "150"
  WORKER_MAX_REPLICAS: "20"
  DB_WORKER_POOL_SIZE: "3"
  DB_WORKER_MAX_OVERFLOW: "0"
  DB_WORKER_CONNECTION_BUDGET: "60"
  DB_ROLLOUT_SURGE_CONNECTION_RESERVE: "20"
  DB_POOLER_MAX_CLIENT_CONNECTIONS: "400"
  DB_SERVER_CONNECTION_LIMIT: "160"
  DB_POOLER_MAX_SERVER_CONNECTIONS: "120"
  DB_DIRECT_CONNECTION_RESERVE: "40"
  DB_POOLER_DEFAULT_POOL_SIZE: "80"
  DB_POOLER_RESERVE_POOL_SIZE: "20"
  POSTGRES_HOST: postgres.example.invalid
  POSTGRES_DB: funkey

  CORS_ALLOWED_ORIGINS: https://app.example.invalid
  MEDIA_STORAGE_DRIVER: s3
  MEDIA_CDN_BASE_URL: https://cdn.example.invalid/media
  REALTIME_LISTEN_ADDR: :8081
  REALTIME_AUTH_VERIFY_URL: http://funkey-api:8000/api/v1/realtime/verify
  REALTIME_REDIS_URL: redis://redis.example.invalid:6379/0
  REALTIME_ORIGINS: https://app.example.invalid
  REALTIME_DRAIN_TIMEOUT: 120s
  REALTIME_MAX_CONNECTIONS: "10000"
  REALTIME_MAX_CONNECTIONS_PER_USER: "4"
  WORKER_SHUTDOWN_GRACE_SECONDS: "60"
  NATS_URL: nats://nats.example.invalid:4222
