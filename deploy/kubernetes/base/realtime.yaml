apiVersion: v1
kind: ServiceAccount
metadata:
  name: funkey-realtime
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-realtime
  labels: {app: funkey-realtime}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector: {matchLabels: {app: funkey-realtime}}
  template:
    metadata:
      labels: {app: funkey-realtime}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
    spec:
      serviceAccountName: funkey-realtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 150
      nodeSelector: {funkey.io/workload: realtime}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: funkey-realtime}}
      containers:
        - name: gateway
          image: funkey-realtime:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8081}]
          envFrom:
            - configMapRef: {name: funkey-config}
            - secretRef: {name: funkey-realtime-secrets, optional: true}
          env:
            - name: REALTIME_NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 1Gi}
          startupProbe:
            httpGet: {path: /live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-realtime
spec:
  selector: {app: funkey-realtime}
  ports: [{name: http, port: 8081, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: funkey-realtime
spec:
  minAvailable: 2
  selector: {matchLabels: {app: funkey-realtime}}
