apiVersion: v1
kind: ServiceAccount
metadata: {name: funkey-notification}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: funkey-notification, labels: {app: funkey-notification}}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: funkey-notification}}
  template:
    metadata:
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8090"}
      labels: {app: funkey-notification}
    spec:
      serviceAccountName: funkey-notification
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector: {funkey.io/workload: application}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: notification
          image: funkey-notification:dev
          ports: [{name: http, containerPort: 8090}]
          envFrom:
            - {configMapRef: {name: funkey-config}}
            - {secretRef: {name: funkey-notification-secrets}}
          volumeMounts:
            - {name: firebase-service-account, mountPath: /var/run/secrets/funkey/firebase, readOnly: true}
          resources: {requests: {cpu: 200m, memory: 384Mi}, limits: {cpu: "1", memory: 768Mi}}
          startupProbe: {httpGet: {path: /live, port: http}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: http}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /ready, port: http}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: firebase-service-account
          secret:
            secretName: funkey-firebase-service-account
---
apiVersion: v1
kind: Service
metadata: {name: funkey-notification}
spec: {selector: {app: funkey-notification}, ports: [{name: http, port: 8090, targetPort: http}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: funkey-notification}
spec: {minAvailable: 2, selector: {matchLabels: {app: funkey-notification}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: funkey-notification-provider, labels: {app: funkey-notification-provider}}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 0}}
  selector: {matchLabels: {app: funkey-notification-provider}}
  template:
    metadata: {labels: {app: funkey-notification-provider}}
    spec:
      serviceAccountName: funkey-notification
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector: {funkey.io/workload: application}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provider
          image: funkey-notification:dev
          command: ["python", "/app/apps/notification-service/provider_worker.py"]
          ports: [{name: health, containerPort: 8091}]
          env:
            - {name: NOTIFICATION_PROVIDER_HEALTH_PORT, value: "8091"}
          envFrom:
            - {configMapRef: {name: funkey-config}}
            - {secretRef: {name: funkey-notification-secrets}}
          volumeMounts:
            - {name: firebase-service-account, mountPath: /var/run/secrets/funkey/firebase, readOnly: true}
          resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
          startupProbe: {httpGet: {path: /live, port: health}, failureThreshold: 30, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /live, port: health}, periodSeconds: 20}
          readinessProbe: {httpGet: {path: /ready, port: health}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes:
        - name: firebase-service-account
          secret:
            secretName: funkey-firebase-service-account
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: funkey-notification-provider}
spec: {minAvailable: 1, selector: {matchLabels: {app: funkey-notification-provider}}}
