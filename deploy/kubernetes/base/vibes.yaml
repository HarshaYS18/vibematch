apiVersion: v1
kind: ServiceAccount
metadata:
  name: funkey-vibes
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-vibes
  labels: {app: funkey-vibes}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: funkey-vibes}
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8084"
      labels: {app: funkey-vibes}
    spec:
      serviceAccountName: funkey-vibes
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector: {funkey.io/workload: application}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: funkey-vibes}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: funkey-vibes}}
      containers:
        - name: vibes
          image: funkey-vibes:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8084}]
          envFrom:
            - configMapRef: {name: funkey-config}
            - secretRef: {name: funkey-vibes-secrets}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          startupProbe:
            httpGet: {path: /live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-vibes
spec:
  selector: {app: funkey-vibes}
  ports: [{name: http, port: 8084, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: funkey-vibes
spec:
  minAvailable: 2
  selector: {matchLabels: {app: funkey-vibes}}
