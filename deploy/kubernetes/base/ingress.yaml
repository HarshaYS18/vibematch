apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: funkey-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.example.invalid]
      secretName: funkey-api-tls
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /api/v1/inbox/stories
            pathType: Prefix
            backend:
              service: {name: funkey-api, port: {name: http}}
          - path: /api/v1/inbox
            pathType: Prefix
            backend:
              service: {name: funkey-inbox, port: {name: http}}
          - path: /api/v1/inbox-ai
            pathType: Prefix
            backend:
              service: {name: funkey-inbox, port: {name: http}}
          - path: /api/v1/calls
            pathType: Prefix
            backend:
              service: {name: funkey-inbox, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: funkey-api, port: {name: http}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: funkey-realtime
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ws.example.invalid]
      secretName: funkey-ws-tls
  rules:
    - host: ws.example.invalid
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service: {name: funkey-realtime, port: {name: http}}
