apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: funkey-api-client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: funkey-public
      sectionName: api
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove: [x-funkey-internal-token, x-funkey-edge-authenticated]
  timeout:
    http:
      requestReceivedTimeout: 15s
      idleTimeout: 60s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: funkey-realtime-client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: funkey-public
      sectionName: realtime
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove: [x-funkey-internal-token, x-funkey-edge-authenticated]
  timeout:
    http:
      requestReceivedTimeout: 10s
      idleTimeout: 3600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: funkey-media-client
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: funkey-public
      sectionName: media
  headers:
    requestID: Generate
    earlyRequestHeaders:
      remove: [x-funkey-internal-token, x-funkey-edge-authenticated]
  timeout:
    http:
      requestReceivedTimeout: 15s
      idleTimeout: 300s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: funkey-api-traffic
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: funkey-api
  requestBuffer:
    limit: 10Mi
  rateLimit:
    local:
      rules:
        - limit: {requests: 500, unit: Second}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: funkey-realtime-traffic
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: funkey-realtime
  rateLimit:
    local:
      rules:
        - limit: {requests: 100, unit: Second}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: funkey-media-control-traffic
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: funkey-media-control
  requestBuffer:
    limit: 1Mi
  rateLimit:
    local:
      rules:
        - limit: {requests: 200, unit: Second}

---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: funkey-graphql-traffic
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: funkey-graphql
  requestBuffer:
    limit: 64Ki
  rateLimit:
    local:
      rules:
        - limit: {requests: 200, unit: Second}
