apiVersion: batch/v1
kind: Job
metadata:
  name: funkey-migrate-release-id
  namespace: funkey
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: alembic
          image: funkey-api:dev
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: funkey-config}
            - secretRef: {name: funkey-api-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
