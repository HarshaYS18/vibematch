apiVersion: apps/v1
kind: Deployment
metadata:
  name: funkey-redis-exporter-cache
  labels:
    app: funkey-redis-exporter
    funkey.io/redis-role: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: funkey-redis-exporter
      funkey.io/redis-role: cache
  template:
    metadata:
      labels:
        app: funkey-redis-exporter
        funkey.io/redis-role: cache
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9121"
    spec:
      automountServiceAccountToken: false
      nodeSelector: {funkey.io/workload: application}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: exporter
          image: oliver006/redis_exporter:v1.91.1
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: funkey-redis-monitoring
                  key: cache_url
            - {name: REDIS_EXPORTER_CONNECTION_TIMEOUT, value: "2s"}
            - {name: REDIS_EXPORTER_LOG_FORMAT, value: json}
            - {name: REDIS_EXPORTER_REDIS_ONLY_METRICS, value: "true"}
          ports: [{name: metrics, containerPort: 9121}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: funkey-redis-exporter-cache
  labels:
    app: funkey-redis-exporter
    funkey.io/redis-role: cache
spec:
  selector:
    app: funkey-redis-exporter
    funkey.io/redis-role: cache
  ports: [{name: metrics, port: 9121, targetPort: metrics}]
