apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: funkey-redis-exporter-ingress
spec:
  podSelector:
    matchLabels: {app: funkey-redis-exporter}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports: [{protocol: TCP, port: 9121}]
