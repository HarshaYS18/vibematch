name: GraphQL Session Smoke

on:
  push:
    branches:
      - 'chatgpt/**'
    paths:
      - '.github/workflows/graphql-session-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphql-session-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start disposable local FunKey dependencies
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/graphql-session-compose.override.yml <<'YAML'
          services:
            api:
              environment:
                database_url: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
                DB_POOLER_MODE: direct
            identity:
              environment:
                database_url: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
                IDENTITY_DATABASE_URL: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
                DB_POOLER_MODE: direct
            room-control:
              environment:
                database_url: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
                ROOM_CONTROL_DATABASE_URL: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
                DB_POOLER_MODE: direct
          YAML

          docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app up --build -d             postgres cache-redis realtime-redis media-redis nats             migrate identity room-control api

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app ps
          docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app logs --tail=200 api identity
          echo "::error::Local FunKey API did not become live."
          exit 1

      - name: Start disposable GraphQL BFF
        shell: bash
        run: |
          set -euo pipefail
          docker build -f apps/graphql-bff/Dockerfile -t funkey-graphql-bff:session .
          docker run -d --name funkey-graphql-bff-session --network host             -e GRAPHQL_CORE_URL=http://127.0.0.1:8000/api/v1             -e GRAPHQL_PROFILE_SOCIAL_URL=http://127.0.0.1:8087/api/v1             -e GRAPHQL_VIBES_URL=http://127.0.0.1:8084/api/v1             funkey-graphql-bff:session

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs funkey-graphql-bff-session
          echo "::error::GraphQL BFF did not become ready."
          exit 1

      - name: Generate session-only test token
        id: session
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="funkey-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          DEVICE="ci-session-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          AUTH_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "${AUTH_FILE}" -w '%{http_code}'             -H 'Content-Type: application/json'             -d "{\"email\":\"${EMAIL}\",\"username\":\"ci_smoke_${GITHUB_RUN_ID}\",\"display_name\":\"CI Smoke\",\"device_id\":\"${DEVICE}\"}"             http://127.0.0.1:8000/api/v1/auth/dev-login)"

          if [ "${STATUS}" != "200" ]; then
            echo "::error::Disposable dev-login returned HTTP ${STATUS}."
            cat "${AUTH_FILE}"
            echo
            docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app logs --tail=200 api identity
            exit 1
          fi

          TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <"${AUTH_FILE}")"
          rm -f "${AUTH_FILE}"
          test -n "${TOKEN}"
          echo "::add-mask::${TOKEN}"
          echo "FUNKEY_TEST_TOKEN=${TOKEN}" >> "${GITHUB_ENV}"

      - name: Probe Home composite errors
        shell: bash
        run: |
          set -euo pipefail
          CORE_FILE="$(mktemp)"
          CORE_STATUS="$(curl -sS -o "${CORE_FILE}" -w '%{http_code}' \
            -H "Authorization: Bearer ${FUNKEY_TEST_TOKEN}" \
            http://127.0.0.1:8000/api/v1/rooms/my-created-room)"
          if [ "${CORE_STATUS}" != "200" ]; then
            echo "::warning::Direct Home owner probe returned HTTP ${CORE_STATUS}."
            cat "${CORE_FILE}"
            echo
            docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app logs --tail=120 api identity
          fi
          rm -f "${CORE_FILE}"

          PROBE_FILE="$(mktemp)"
          curl -sS \
            -H "Authorization: Bearer ${FUNKEY_TEST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"id":"49caa7816c5a823071f7b812cfcc35b6ee996fe337da55dce98f121c776c16f6","variables":{}}' \
            http://127.0.0.1:8091/graphql >"${PROBE_FILE}"
          python - "${PROBE_FILE}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              body = json.load(handle)
          print(json.dumps({"errors": body.get("errors", [])}, indent=2))
          PY
          rm -f "${PROBE_FILE}"

      - name: Run authenticated persisted GraphQL smoke
        shell: bash
        env:
          FUNKEY_API_URL: http://127.0.0.1:8091
          VUS: '5'
          DURATION: '30s'
        run: |
          set -euo pipefail
          docker run --rm --network host             -e FUNKEY_API_URL             -e FUNKEY_TEST_TOKEN             -e VUS             -e DURATION             -v "${PWD}/tests/load:/scripts:ro"             grafana/k6:0.52.0             run /scripts/graphql-read-smoke.js

      - name: Cleanup disposable session environment
        if: always()
        shell: bash
        run: |
          docker rm -f funkey-graphql-bff-session >/dev/null 2>&1 || true
          docker compose -f infra/docker-compose.yml -f /tmp/graphql-session-compose.override.yml --profile app down -v --remove-orphans || true
