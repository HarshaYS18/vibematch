name: Chunk 16 dependency lock refresh

on:
  push:
    branches:
      - chatgpt/funkey-frontend-architecture-v1
    paths:
      - 'tools/chunk16-dependency-refresh.trigger'

permissions:
  contents: write

jobs:
  refresh-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/funkey-frontend-architecture-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Refresh media package lock
        working-directory: backend_media
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/realtime-gateway/go.mod
      - name: Refresh Go module lock
        working-directory: apps/realtime-gateway
        run: go mod tidy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Refresh Flutter pub lock
        working-directory: frontend/vibematch_app
        run: flutter pub get
      - name: Commit generated dependency locks
        shell: bash
        run: |
          git config user.name "funkey-ci"
          git config user.email "funkey-ci@users.noreply.github.com"
          git add backend_media/package-lock.json apps/realtime-gateway/go.mod apps/realtime-gateway/go.sum frontend/vibematch_app/pubspec.lock
          if git diff --cached --quiet; then
            echo "Dependency locks already current."
            exit 0
          fi
          git commit -m "chore: refresh Chunk 16 telemetry dependency locks"
          git push origin HEAD:chatgpt/funkey-frontend-architecture-v1
