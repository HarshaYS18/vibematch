name: Backend Media Architecture

on:
  push:
    branches:
      - chatgpt/room-production-hardening
      - chatgpt/backend-media-consolidation-v1
      - codex/backend-media-consolidation-checkpoint
      - codex/funkey-production-backend-v1
  pull_request:
    paths:
      - 'backend/**'
      - 'backend_media/**'
      - 'apps/**'
      - 'deploy/**'
      - 'infra/**'
      - 'tests/load/**'
      - 'tests/chaos/**'
      - '.github/workflows/production-platform.yml'
      - 'frontend/vibematch_app/**'
      - 'scripts/check_backend_architecture.py'
      - 'PRODUCTION_RUNBOOK.md'
      - '.github/workflows/room-production-hardening.yml'

permissions:
  contents: read

jobs:
  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify canonical backend/media architecture
        run: python scripts/check_backend_architecture.py

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibematch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-test.txt
      - name: Validate imports and migration graph
        run: |
          python -m compileall -q app ../apps/worker
          alembic heads
          alembic history
      - name: Replay fresh and legacy database upgrades
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibematch_test
        run: python check_migrations.py
      - name: Run backend regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  media-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend_media/package-lock.json
      - name: Install media dependencies
        run: npm ci
      - name: Typecheck media service
        run: npm run typecheck
      - name: Build media service
        run: npm run build
      - name: Lint and test media lifecycle
        run: npm run lint && npm test

  flutter-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vibematch_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Verify Flutter dependency lockfile
        run: git diff --exit-code -- pubspec.lock
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze Flutter
        run: flutter analyze
      - name: Build production web bundle
        run: flutter build web --release
