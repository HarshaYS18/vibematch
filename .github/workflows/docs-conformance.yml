name: Docs and Architecture Conformance

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'backend_media/**'
      - 'frontend/vibematch_app/**'
      - 'contracts/**'
      - 'docs/**'
      - 'catalog/**'
      - 'scripts/check_*'
      - 'mkdocs.yml'
      - '.github/CODEOWNERS'
      - '.github/workflows/docs-conformance.yml'
  push:
    branches: [main, 'chatgpt/**', 'codex/**']
    paths:
      - 'backend/**'
      - 'apps/**'
      - 'backend_media/**'
      - 'frontend/vibematch_app/**'
      - 'contracts/**'
      - 'docs/**'
      - 'catalog/**'
      - 'scripts/check_*'
      - 'mkdocs.yml'

permissions:
  contents: read

jobs:
  docs-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check repository-local documentation links
        run: python scripts/check_docs_links.py
      - name: Check architecture conformance
        run: python scripts/check_architecture_conformance.py
