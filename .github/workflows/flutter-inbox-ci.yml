name: Flutter Inbox CI

on:
  push:
    branches:
      - inbox-v3-clean-ui-rebuild
  pull_request:
    paths:
      - 'frontend/vibematch_app/**'
      - '.github/workflows/flutter-inbox-ci.yml'

jobs:
  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/vibematch_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
