# Gitleaks configuration for known non-secret FunKey infrastructure literals.
# Keep this allowlist narrow: it must never suppress credentials, tokens, keys,
# public endpoints, or arbitrary values in Kubernetes manifests.

[extend]
useDefault = true

[[allowlists]]
description = "FunKey Kubernetes in-cluster HTTP service URLs are routing metadata, not secrets"
regexTarget = "match"
regexes = [
  '''http://funkey-(?:inbox|vibes|room-control|identity|profile-social|economy|game-platform|notification):[0-9]{2,5}'''
]
