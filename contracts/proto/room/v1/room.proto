syntax = "proto3";

package funkey.room.v1;

import "common/v1/context.proto";

option go_package = "github.com/HarshaYS18/vibematch/gen/go/funkey/room/v1;roomv1";

service RoomControlService {
  rpc GetRoomSnapshot(GetRoomSnapshotRequest) returns (RoomSnapshot);
  rpc CheckRoomPermission(CheckRoomPermissionRequest) returns (CheckRoomPermissionResponse);
}

message GetRoomSnapshotRequest {
  funkey.common.v1.RequestContext context = 1;
  string room_public_id = 2;
}

message CheckRoomPermissionRequest {
  funkey.common.v1.RequestContext context = 1;
  string room_public_id = 2;
  string action = 3;
}

message CheckRoomPermissionResponse {
  bool allowed = 1;
  string reason_code = 2;
}

message RoomMember {
  int64 user_id = 1;
  int64 public_user_id = 2;
  string role = 3;
  int32 seat_index = 4;
  bool mic_enabled = 5;
}

message RoomSnapshot {
  string room_public_id = 1;
  uint64 state_version = 2;
  repeated RoomMember members = 3;
  string activity_kind = 4;
  string activity_phase = 5;
  uint64 activity_revision = 6;
  string watch_party_provider = 7;
  uint64 watch_party_revision = 8;
}
