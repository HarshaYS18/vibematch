version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/protocolbuffers/python:v36.2
    out: gen/python
  - remote: buf.build/grpc/python:v1.84.0
    out: gen/python
  - remote: buf.build/bufbuild/es:v2.15.0
    out: gen/ts
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: gen/dart
    opt:
      - grpc
