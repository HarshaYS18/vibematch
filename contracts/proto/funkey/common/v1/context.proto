syntax = "proto3";

package funkey.common.v1;

option go_package = "github.com/HarshaYS18/vibematch/gen/go/funkey/common/v1;commonv1";

message RequestContext {
  string request_id = 1;
  string traceparent = 2;
  int64 actor_user_id = 3;
  string idempotency_key = 4;
}

message Empty {}

message MoneyAmount {
  int64 units = 1;
  string currency = 2;
}
