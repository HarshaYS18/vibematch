name: funkey-dev

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
    environment:
      POSTGRES_USER: funkey
      POSTGRES_PASSWORD: funkey_dev_only
      POSTGRES_DB: funkey
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funkey -d funkey"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgbouncer:
    image: pgbouncer/pgbouncer:1.25.2
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: funkey
      DATABASES_PASSWORD: funkey_dev_only
      DATABASES_DBNAME: funkey
      DATABASES_MAX_DB_CONNECTIONS: "30"
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "100"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_RESERVE_POOL_SIZE: "5"
      PGBOUNCER_MAX_PREPARED_STATEMENTS: "200"
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_QUERY_WAIT_TIMEOUT: "5"
      QUIET: "1"
    ports: ["127.0.0.1:6432:6432"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 20

  cache-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lfu
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["cache_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  realtime-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["realtime_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  media-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["media_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes: ["nats_data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["app"]
    build: {context: .., dockerfile: backend/Dockerfile}
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    environment: &api_environment
      APP_ENV: development
      ENFORCE_SCHEMA_CURRENT: "false"
      database_url: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
      MIGRATION_DATABASE_URL: postgresql://funkey:funkey_dev_only@postgres:5432/funkey
      DB_POOLER_MODE: transaction
      DB_APPLICATION_NAME: funkey-api
      redis_url: redis://cache-redis:6379/0
      CACHE_REDIS_URL: redis://cache-redis:6379/0
      REALTIME_REDIS_URL: redis://realtime-redis:6379/0
      MEDIA_REGISTRY_REDIS_URL: redis://media-redis:6379/0
      JWT_SECRET_KEY: local-development-only-secret-change-before-production
      MEDIA_INTERNAL_TOKEN: local-development-only-media-token-change-me
      INBOX_SERVICE_URL: http://inbox:8083/api/v1
      INBOX_INTERNAL_URL: http://inbox:8083/internal/inbox
      INBOX_INTERNAL_TOKEN: local-development-inbox-internal-token-2026
      INBOX_REALTIME_TRANSPORT: nats
      INBOX_NATS_SUBJECT: funkey.events.inbox.realtime
      VIBES_SERVICE_URL: http://vibes:8084/api/v1
      VIBES_INTERNAL_URL: http://vibes:8084/internal/vibes
      VIBES_INTERNAL_TOKEN: local-development-vibes-internal-token-2026
      ROOM_CONTROL_SERVICE_URL: http://room-control:8085/api/v1
      ROOM_CONTROL_INTERNAL_URL: http://room-control:8085/internal/room-control
      ROOM_CONTROL_INTERNAL_TOKEN: local-development-room-control-token-2026
      IDENTITY_SERVICE_URL: http://identity:8086/api/v1
      IDENTITY_INTERNAL_URL: http://identity:8086/internal/identity
      IDENTITY_INTERNAL_TOKEN: local-development-identity-internal-token-2026
      PROFILE_SOCIAL_SERVICE_URL: http://profile-social:8087/api/v1
      PROFILE_SOCIAL_INTERNAL_URL: http://profile-social:8087/internal/profile-social
      PROFILE_SOCIAL_INTERNAL_TOKEN: local-development-profile-social-token-2026
      ECONOMY_SERVICE_URL: http://economy:8088/api/v1
      ECONOMY_INTERNAL_URL: http://economy:8088/internal/economy
      ECONOMY_INTERNAL_TOKEN: local-development-economy-internal-token-2026
      NATS_URL: nats://nats:4222
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8080
      ENABLE_DEV_LOGIN: "true"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    profiles: ["app"]
    build: {context: .., dockerfile: backend/Dockerfile}
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      cache-redis: {condition: service_healthy}
      identity: {condition: service_started}

  inbox:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/inbox-service/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-inbox
      INBOX_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
      INBOX_REALTIME_TRANSPORT: nats
      NATS_URL: nats://nats:4222
    ports: ["127.0.0.1:8083:8083"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      nats: {condition: service_healthy}
      realtime-redis: {condition: service_healthy}

  vibes:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/vibes-service/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-vibes
      VIBES_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
    ports: ["127.0.0.1:8084:8084"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      nats: {condition: service_healthy}

  room-control:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/room-control-service/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-room-control
      ROOM_CONTROL_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
    ports: ["127.0.0.1:8085:8085"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      realtime-redis: {condition: service_healthy}

  identity:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/identity-service/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-identity
      IDENTITY_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
    ports: ["127.0.0.1:8086:8086"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}

  profile-social:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/profile-social-service/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-profile-social
      PROFILE_SOCIAL_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
    ports: ["127.0.0.1:8087:8087"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}
      inbox: {condition: service_started}

  economy:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/economy-service/Dockerfile
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-economy
      ECONOMY_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy

  economy-bulk-worker:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: apps/economy-service/Dockerfile
    command: ["python", "/app/apps/economy-service/bulk_worker.py"]
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-economy-bulk-worker
      ECONOMY_DATABASE_URL: postgresql://funkey:funkey_dev_only@pgbouncer:6432/funkey
      ECONOMY_BULK_HEALTH_PORT: "8090"
      ECONOMY_BULK_WORKER_DB_POOL_SIZE: "2"
      ECONOMY_BULK_WORKER_DB_MAX_OVERFLOW: "0"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy

  realtime:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/realtime-gateway/Dockerfile}
    environment:
      REALTIME_LISTEN_ADDR: :8081
      REALTIME_AUTH_VERIFY_URL: http://api:8000/api/v1/realtime/verify
      REALTIME_REDIS_URL: redis://realtime-redis:6379/0
      REALTIME_NATS_URL: nats://nats:4222
      REALTIME_NATS_INBOX_SUBJECT: funkey.events.inbox.realtime
      REALTIME_INBOX_COMMAND_URL: http://inbox:8083/api/v1/realtime/command
      REALTIME_ORIGINS: http://localhost:3000,http://localhost:8080
      REALTIME_NODE_ID: realtime-local-1
      REALTIME_DRAIN_TIMEOUT: 30s
    ports: ["127.0.0.1:8081:8081"]
    depends_on:
      api: {condition: service_started}
      realtime-redis: {condition: service_healthy}
      nats: {condition: service_healthy}

  worker:
    profiles: ["app"]
    build: {context: .., dockerfile: apps/worker/Dockerfile}
    environment:
      <<: *api_environment
      DB_APPLICATION_NAME: funkey-worker
      DB_POOL_SIZE: "3"
      DB_MAX_OVERFLOW: "0"
      NATS_URL: nats://nats:4222
    depends_on:
      nats: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      pgbouncer: {condition: service_healthy}

volumes:
  postgres_data:
  cache_redis_data:
  realtime_redis_data:
  media_redis_data:
  nats_data:
